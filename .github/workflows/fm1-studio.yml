name: Build FM1 Studio Firmware (.fwsc)
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-fm1-studio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Inject Modules
        run: |
          mkdir -p firmware/studio tests release/FM1-Studio-v1.0
          echo '' | base64 -d > firmware/studio/wavescope.h
          echo '' | base64 -d > firmware/studio/wavescope.c
          echo '' | base64 -d > firmware/studio/studio_engines.h
          echo '' | base64 -d > firmware/studio/studio_engines.c
          echo '' | base64 -d > firmware/studio/studio_dsp_fx.h
          echo '' | base64 -d > firmware/studio/studio_dsp_fx.c
          echo '' | base64 -d > tests/test_fm1_studio.c
          echo '' | base64 -d > FM1_STUDIO_PROGRESS.md
      - name: Install Tools
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential clang pkg-config libsdl2-dev libasound2-dev curl xz-utils git
          python3 -m pip install --break-system-packages Pillow fonttools
      - name: Run Tests
        run: |
          clang -O2 tests/test_fm1_studio.c firmware/studio/wavescope.c firmware/studio/studio_engines.c firmware/studio/studio_dsp_fx.c -lm -o run_tests && ./run_tests
      - name: Toolchain & SDK
        run: |
          ./tools/get_toolchain.sh
          if [ ! -d "$HOME/fw-AC79_AIoT_SDK" ]; then
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK" || git clone --depth 1 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
          fi
      - name: Compile
        run: |
          ./build.sh
          cp build/*.fwsc release/FM1-Studio-v1.0/FM1-Studio-v1.0.fwsc
          cp build/*-res.bin release/FM1-Studio-v1.0/ 2>/dev/null || true
          cp FM1_STUDIO_PROGRESS.md release/FM1-Studio-v1.0/
          cd release/FM1-Studio-v1.0 && sha256sum FM1-Studio-v1.0.fwsc * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: FM1-Studio-v1.0-Firmware-Package
          path: release/FM1-Studio-v1.0/
